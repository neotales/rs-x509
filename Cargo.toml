[package]
name = "neotales-x509"
description = "X.509 certificate identifiers, parsing and generation, and the SSH wire conversions for certificates and keys"
version = "0.0.0-alpha.1"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/neotales/rs-x509"
authors = ["Neotales"]
readme = "README.md"
keywords = ["x509", "certificate", "ssh", "pkcs8", "ed25519"]
categories = ["cryptography", "network-programming"]

[dependencies]
aes = "0.9.2"
base64 = "0.22"
blowfish = { version = "0.10.0", features = ["bcrypt"] }
ctr = "0.10.1"
ed25519-dalek = { version = "3.0.0", features = ["alloc", "pkcs8"] }
ml-dsa = { version = "=0.1.2", default-features = false, features = ["alloc"] }
p256 = { version = "0.14.0", features = ["arithmetic", "ecdsa", "pkcs8"] }
p384 = "0.14.0"
p521 = "0.14.0"
rcgen = { version = "0.14.7", features = ["zeroize", "x509-parser"] }
rsa = { version = "0.9.10", features = ["sha2"] }
sha2 = "0.11"
subtle = "2.6.1"
time = { version = "0.3", features = ["parsing", "formatting", "macros"] }
zeroize = { version = "=1.9.0", features = ["derive"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
